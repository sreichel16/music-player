<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="player">

      <div class="disc">

        <div class="screen">
          <p class="screen-label">NOW PLAYING</p>
          <h1 id="song-title">NO SONG LOADED</h1>
          <p id="song-artist">--</p>
          <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" value="0" />
            <span id="total-time">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button class="ctrl-btn" id="prev-btn">⏮</button>
          <button class="ctrl-btn" id="play-btn">▶</button>
          <button class="ctrl-btn" id="next-btn">⏭</button>
        </div>

        <div class="volume-container">
          <span>🔈</span>
          <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" />
          <span>🔊</span>
        </div>

        <div class="action-btns">
          <input type="file" id="file-input" accept="audio/*" multiple />
          <label for="file-input" class="file-label">+ ADD</label>
          <button id="playlist-btn">LIST ☰</button>
          <button id="share-btn">SHARE ✉</button>
        </div>

      </div>

    <div class="playlist-panel" id="playlist-panel">
  <button id="close-playlist-btn">✕</button>
  <p class="screen-label">PLAYLIST</p>
  <ul id="playlist"></ul>
</div>

    </div>
    <audio id="audio"></audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
